<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a group on Penpus</title>
  <!-- Open Graph / link previews (WhatsApp, iMessage, Telegram, Slack…). This
       one static page serves every /join/<code>, so the preview is generic.
       og:image MUST be an absolute https URL or crawlers skip it. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Penpus" />
  <meta property="og:title" content="Join a group | community on Penpus" />
  <meta property="og:description" content="You've been invited to a group | community on Penpus — tap to view and join." />
  <meta property="og:image" content="https://penpus.com/logo.png" />
  <meta property="og:image:width" content="1060" />
  <meta property="og:image:height" content="1060" />
  <meta property="og:url" content="https://penpus.com/join" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Join a group on Penpus" />
  <meta name="twitter:description" content="You've been invited to a group | community on Penpus — tap to view and join." />
  <meta name="twitter:image" content="https://penpus.com/logo.png" />
  <meta name="description" content="You've been invited to a group | community on Penpus — tap to view and join." />
  <link rel="icon" href="/logo-rounded.svg" type="image/svg+xml" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <style>
    :root {
      --blue: #2563EB;
      --bg: #ffffff;
      --card: #f6f8fc;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --card: #131c2e;
        --text: #e8edf6;
        --muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.08);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 20px;
      display: block;
      object-fit: cover;
      margin: 0 auto 18px;
    }
    h1 { font-size: 21px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    .btn {
      display: block; width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px; font-weight: 600;
      text-decoration: none;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }
    .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .stores {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    /* White rounded backing so the black official PNGs stand out. */
    .stores a {
      display: inline-flex;
      background: #fff;
      border-radius: 6px;
      padding: 3px 5px;
      box-shadow: 0 4px 14px -8px rgba(0, 0, 0, .5);
    }
    /* Match each badge's native aspect ratio so neither looks stretched. */
    .stores img { height: 40px; width: auto; display: block; }
    .foot { font-size: 12px; color: var(--muted); margin: 20px 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Penpus" />
    <h1>You're invited to a group | community on Penpus</h1>
    <p id="sub">Open the link in the Penpus app to view and join now.</p>

    <a class="btn primary" id="openApp" href="#">Open in Penpus</a>

    <div class="stores">
      <a id="appStore" href="https://apps.apple.com/ng/app/penpus-all-campus-hub/id6789201059">
        <img src="/app_store_badge.png" alt="Download on the App Store" />
      </a>
      <a id="playStore" href="https://play.google.com/store/apps/details?id=com.allcampusapp.allcampus">
        <img src="/play_store_badge.png" alt="Get it on Google Play" />
      </a>
    </div>

    <p class="foot">Penpus &middot; penpus.com</p>
  </div>

  <script>
    // The invite code is the last path segment: /join/<code>
    var parts = window.location.pathname.split('/').filter(Boolean);
    var code = parts.length >= 2 && parts[0] === 'join' ? parts[1] : '';
    var httpsUrl = 'https://penpus.com/join/' + code;
    var playUrl =
      'https://play.google.com/store/apps/details?id=com.allcampusapp.allcampus';

    var ua = navigator.userAgent || '';
    var isAndroid = /android/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua);

    // A plain https link clicked INSIDE a browser just navigates in-browser —
    // Android App Links only auto-open the app when tapped from another app.
    // An intent:// URL force-routes to the installed app, with a Play Store
    // fallback when it isn't installed. iOS keeps the https universal link.
    var openBtn = document.getElementById('openApp');
    if (isAndroid) {
      openBtn.setAttribute('href',
        'intent://penpus.com/join/' + code +
        '#Intent;scheme=https;package=com.allcampusapp.allcampus;' +
        'S.browser_fallback_url=' + encodeURIComponent(playUrl) + ';end');
    } else {
      openBtn.setAttribute('href', httpsUrl);
    }

    // Show only the relevant store on mobile.
    if (isAndroid) {
      document.getElementById('appStore').style.display = 'none';
    } else if (isIOS) {
      document.getElementById('playStore').style.display = 'none';
    }
  </script>
</body>
</html>
