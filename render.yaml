# Render Blueprint for the Penpus marketing + deep-link site.
# Static export of the Next app (out/) served from Render's CDN.
services:
  - type: web
    name: penpus-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    # Group invite deep links: every /join/<code> serves the single static
    # fallback page. type:rewrite keeps the URL as /join/<code> (HTTP 200,
    # NOT a 30x) so the OS App Link / Universal Link can read the invite
    # code and hand off to the Penpus app when it's installed.
    routes:
      - type: rewrite
        source: /join/*
        destination: /join.html
      # Personal links: /u/<handle>, same rewrite reason as /join.
      - type: rewrite
        source: /u/*
        destination: /u.html
      # Shared match links: /challenge/<matchId>, same again.
      - type: rewrite
        source: /challenge/*
        destination: /challenge.html
      # League invites: /league/<joinCode>, same again.
      - type: rewrite
        source: /league/*
        destination: /league.html
      # Spectate: /watch/<matchId>. Unlike the four above this page is not a
      # hand-off shell — it renders the match itself, so someone with no app
      # can watch. Served by the exported Next route, hence /watch/index.html
      # rather than a public/*.html file.
      - type: rewrite
        source: /watch/*
        destination: /watch/index.html
    # Read by app/watch/WatchLive.tsx and inlined at BUILD time. Set the values
    # in the Render dashboard — they are not committed, matching how the mobile
    # app keeps them in a gitignored .env. The anon key is the browser's public
    # key; what a watcher may see is enforced by get_spectate_feed in Postgres,
    # never by this client.
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
